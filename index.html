/* V10: fotografieorientierte Roadbook-Detailansicht. Originales Bildformat erhalten. */
.detail-magazine{padding-bottom:28px}

eft:15px}.timeline-number{width:29px;height:29px}.timeline-main{gap:10px;padding:10px}.timeline-photo{width:80px;height:92px}.timeline-copy h3{font-size:18px}.timeline-copy p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.stop-move{padding:6px 8px}}
/* V11.1 Eintrittspreise und Ticketstatus */
.editor-checkbox{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px}.editor-checkbox input{width:20px;height:20px;accent-color:#4d867d;flex:none}.stop-ticket-meta,.detail-ticket-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.stop-price,.stop-ticket-bought{display:inline-flex;align-items:center;border-radius:30px;padding:3px 9px;background:#e8f1ef;font-size:11px;font-weight:750;color:#31615d}.stop-ticket-bought{background:#e4f0dc;color:#396143}.detail-ticket-meta{gap:9px;margin:0 0 17px}.detail-ticket-meta span{font-size:13px;padding:7px 13px}

.app,.content,.route-card,.timeline,.timeline-card,.detail-shell{min-width:0;max-width:100%}
.content{overflow-wrap:anywhere}

.route-map .leaflet-container,.map .leaflet-container{max-width:100%}
.timeline-stop{min-width:0;max-width:100%}
.timeline-main{min-width:0}
.timeline-copy{min-width:0;overflow-wrap:anywhere}
.timeline-copy h3,.timeline-copy p,.timeline-meta{overflow-wrap:anywhere}
.timeline-tools{min-width:0;flex-wrap:wrap}
.timeline-visited{min-width:0}
.stop-ticket-meta{min-width:0}
.titlebar,.row.between{min-width:0;flex-wrap:wrap}
.row.between>.btn{max-width:100%;white-space:normal;overflow-wrap:anywhere}
@media(max-width:500px){
 .content{padding:19px 12px}

 .timeline-stop{grid-template-columns:27px minmax(0,1fr);gap:5px}

}

function installStopDrag(){
 const holder=document.getElementById('day-timeline');if(!holder||!isGoogleReady()||stopReorderBusy)return;
 for(const grip of holder.querySelectorAll('[data-move]')){
  grip.addEventListener('pointerdown',event=>{
   if(stopReorderBusy||event.button!==0&&event.pointerType==='mouse')return;
   const item=grip.closest('.timeline-stop');if(!item)return;
   const id=item.dataset.stopId;draggingStop={id,pointer:event.pointerId,startY:event.clientY,moved:false};
   grip.setPointerCapture(event.pointerId);item.classList.add('timeline-dragging');event.preventDefault();
  });
  grip.addEventListener('pointermove',event=>{
   if(!draggingStop||draggingStop.pointer!==event.pointerId)return;
   if(Math.abs(event.clientY-draggingStop.startY)>9)draggingStop.moved=true;
   if(!draggingStop.moved)return;
   const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('.timeline-stop');
   const source=holder.querySelector('.timeline-dragging');
   if(target&&source&&target!==source&&target.parentElement===holder){
    const box=target.getBoundingClientRect();
    holder.insertBefore(source,event.clientY<box.top+box.height/2?target:target.nextSibling);
   }
  });
  const finish=event=>{
   if(!draggingStop||draggingStop.pointer!==event.pointerId)return;
   const moved=draggingStop.moved;draggingStop=null;
   const source=holder.querySelector('.timeline-dragging');if(source)source.classList.remove('timeline-dragging');
   if(!moved)return;
   const ids=Array.from(holder.querySelectorAll('.timeline-stop')).map(x=>x.dataset.stopId);
   const dayId=state.days.find(d=>d.id===selected)?.id;if(dayId)persistDayStopOrder(dayId,ids);

  grip.addEventListener('pointerup',finish);grip.addEventListener('pointercancel',()=>{draggingStop=null;render()});
 }
}

 if(autoRouteLastKey===fingerprint)return;autoRouteLastKey=fingerprint;

  const usableNodes=nodes.filter(n=>n.coords);const endpoint='https://router.project-osrm.org/route/v1/driving/'+usableNodes.map(n=>n.coords[1]+','+n.coords[0]).join(';')+'?overview=full&geometries=geojson&steps=false';

function locationSearchCandidates(item){
 const primary=String(item.place||'').trim();
 const values=[primary];
 const cleaned=primary.replace(/,?\s*\b(?:Iceland|Island|Ísland)\b\s*$/i,'').replace(/,?\s*\b\d{3}\b\s*,?/g,'').replace(/,\s*,/g,',').replace(/[,\s]+$/,'').trim();
 if(cleaned&&cleaned!==primary)values.push(cleaned+', Iceland');
 if(cleaned&&cleaned!==primary)values.push(cleaned);
 const stay=item.stay;
 if(stay?.place)values.push(String(stay.place).trim()+', Iceland');
 if(stay?.name&&stay.name!==stay?.place)values.push(String(stay.name).trim()+', Iceland');

}
