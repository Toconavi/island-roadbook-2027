<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAFBF9"><link rel="manifest" href="manifest.webmanifest"><title>Island 2027 · Roadbook V4</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{--bg:#fafbf9;--cream:#f1ede5;--blue:#a7c9d0;--sage:#81968c;--ink:#29383d;--muted:#6d7a7c;--line:#e5e8e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;padding-bottom:95px}.hero{height:325px;background:linear-gradient(180deg,transparent 15%,rgba(14,35,39,.82)),url('https://images.unsplash.com/photo-1476610182048-b716b8518aae?w=1600&q=85') center/cover;color:white;display:flex;align-items:end;padding:28px 24px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700}.hero h1{font:700 49px/1.08 Georgia,serif;margin:8px 0}.hero p{margin:4px 0;color:#eef4f2}.content{padding:24px 18px}.tabs{display:flex;gap:8px;overflow:auto;padding:0 18px 16px}.tab{border:0;border-radius:30px;padding:10px 16px;background:var(--cream);white-space:nowrap;color:var(--ink)}.tab.active{background:var(--blue);font-weight:700}.card{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 5px 18px #29383d08;margin:0 0 14px}.pad{padding:18px}.section{font:700 26px/1.2 Georgia,serif;margin:14px 0 16px}.sub{color:var(--muted);font-size:13px}.photo{width:100%;height:215px;object-fit:cover;background:var(--cream)}.pill{display:inline-block;background:#e6eff0;padding:4px 10px;border-radius:40px;font-size:12px;margin:3px 4px 3px 0}.btn{border:0;border-radius:14px;padding:11px 15px;background:var(--blue);color:var(--ink);font-weight:700}.btn.alt{background:var(--cream)}.btn.small{font-size:12px;padding:8px 11px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1}.stop{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.stop:last-child{border:0}.thumb{height:82px;width:93px;border-radius:12px;object-fit:cover;background:var(--cream)}.stop h3{margin:0;font-size:17px}.stop p{margin:3px 0}.check{width:24px;height:24px;accent-color:var(--sage);flex:none}.detail h2{font:700 38px/1.1 Georgia,serif;margin:12px 0}.detail p{white-space:pre-line}.detail .photo{height:300px}.info{background:var(--cream);border-radius:16px;padding:14px;margin:14px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 8px max(12px,env(safe-area-inset-bottom));gap:3px;z-index:9}.bottom button{width:min(20%,160px);border:0;background:transparent;padding:6px 0;color:var(--ink);font-size:11px}.bottom button b{display:block;font-size:21px;font-weight:400}.bottom button.active{background:#e2eef0;border-radius:13px}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:13px;font-weight:700}.form input,.form textarea,.form select{border:1px solid #ccd5d3;border-radius:12px;padding:11px;background:white;color:var(--ink);width:100%}.form textarea{min-height:110px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px 15px;background:#fff4d9;border-radius:14px;font-size:13px;margin:12px 0}.map{height:290px;border-radius:18px;overflow:hidden;background:#e6eff0}.map iframe{border:0;width:100%;height:100%}.tiny{font-size:12px}.muted{color:var(--muted)}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:7px;border-radius:8px;background:#e7eae7;overflow:hidden;margin:9px 0}.progress span{height:100%;display:block;background:var(--sage)}@media(min-width:700px){.content{padding:28px}.hero{height:390px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.cards .card{margin:0}.photo{height:200px}}
</style></head><body><div id="app" class="app"></div><nav id="bottom" class="bottom"></nav><script>
const KEY='island-roadbook-prototype-v1';const photo={hero:'https://images.unsplash.com/photo-1476610182048-b716b8518aae?w=1300&q=85',water:'https://images.unsplash.com/photo-1476610182048-b716b8518aae?w=900&q=85',land:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900&q=85',beach:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900&q=85'};
const dates=Array.from({length:18},(_,i)=>{let d=new Date(Date.UTC(2027,7,6+i));return {id:'day'+i,date:d.toISOString().slice(0,10),title:i===0?'Ankunft & Start':i===17?'Rückflug & Heimreise':`Island entdecken · Tag ${i+1}`,route:i===0?'Keflavík → Südküste':i===17?'Reykjavík → Keflavík':'Route noch gemeinsam planen',description:'Tagesprogramm wird gemeinsam ausgearbeitet.',image:photo.hero}});
const seed={days:dates,stops:[{id:'flight-in',day:'day0',time:'09:00',title:'Ankunft am Flughafen Keflavík',type:'Flug',duration:'',image:photo.hero,description:'Ankunft in Island, Gepäck übernehmen und Mietwagen abholen. Die tatsächlichen Flugdaten ergänzen wir, sobald die Buchung vorliegt.',audio:'',done:false,notes:''},{id:'car',day:'day0',time:'10:30',title:'Mietwagen übernehmen',type:'Organisation',duration:'60 Min.',image:photo.land,description:'Fahrzeug kontrollieren, Versicherungsbedingungen und F-Strassen-Freigabe prüfen. Keine Flussdurchquerungen.',audio:'',done:false,notes:''},{id:'flight-out',day:'day17',time:'',title:'Rückflug ab Keflavík',type:'Flug',duration:'',image:photo.hero,description:'Mietwagenrückgabe, Check-in und Rückflug. Flugnummer und Abflugzeit noch offen.',audio:'',done:false,notes:''}],stays:[],flights:[{id:'fin',direction:'Hinflug',date:'2027-08-06',from:'Zürich (geplant)',to:'Keflavík (KEF)',number:'',departure:'',arrival:'09:00',airline:'',booking:'',paid:0,total:0,currency:'CHF',notes:'Ankunft ca. 09:00 – Flug noch nicht eingetragen'},{id:'fout',direction:'Rückflug',date:'2027-08-23',from:'Keflavík (KEF)',to:'Zürich (geplant)',number:'',departure:'',arrival:'',airline:'',booking:'',paid:0,total:0,currency:'CHF',notes:'Abflugzeit noch offen'}],tasks:[{id:'t1',title:'Flüge erfassen und Buchungsdaten ergänzen',done:false},{id:'t2',title:'Mietwagen und Hochland-Freigabe prüfen',done:false},{id:'t3',title:'Unterkünfte entlang der Route planen',done:false}],settings:{trip:'Island 2027',travellers:3}};
const SHEET_STORAGE_KEY='island-sheet-id';let sheetId=localStorage.getItem(SHEET_STORAGE_KEY)||'';let googleToken=null;let sheetsConnected=false;let stopSnapshots=new Map();let stopsSynced=false;let googleClientId=localStorage.getItem('island-google-oauth-client-id')||'598233894070-ekjraoopc5km67lr37f46vln3sb5i4ap.apps.googleusercontent.com';let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}let view='home',selected='day0',detail=null,editing=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'long'});const currency=(n,c='CHF')=>new Intl.NumberFormat('de-CH',{style:'currency',currency:c}).format(Number(n)||0);const el=document.getElementById('app');function nav(v){view=v;detail=null;editing=null;render();scrollTo(0,0)}function openDay(id){selected=id;nav('day')}function openStop(id){detail=id;nav('detail')}function edit(kind,id){if(kind==='flight'){alert('Flug- und Buchungsdaten bitte direkt in Google Sheets bearbeiten.');return}if(kind==='day'){alert('Route und Reisedaten bitte direkt in Google Sheets bearbeiten.');return}editing={kind,id};nav('edit');editing={kind,id};render()}
function header(){return `<div class="hero"><div><div class="eyebrow">Gemeinsames Roadbook · 3 Reisende</div><h1>Island 2027</h1><p>${fmt(state.days[0].date)} – ${fmt(state.days[state.days.length-1].date)} · ${state.days.length} Reisetage · Daten vorläufig</p><p>Von den Flügen bis zur Heimreise</p></div></div>`}
function stopHTML(s){return `<div class="stop"><img class="thumb" src="${esc(s.image||photo.water)}" onerror="this.src='${photo.hero}'"><div class="grow" onclick="openStop('${s.id}')"><div class="sub">${esc(s.time)} · ${esc(s.type)} ${s.duration?'· '+esc(s.duration):''}</div><h3>${esc(s.title)}</h3><p class="sub">${esc((s.description||'').slice(0,100))}${s.description?.length>100?'…':''}</p></div><input aria-label="Besucht" class="check" type="checkbox" ${s.done?'checked':''} onchange="toggle('stops','${s.id}',this.checked)"></div>`}
function home(){let completed=state.stops.filter(s=>s.done).length;return header()+`<div class="content"><div class="titlebar"><h2 class="section">Unsere Reise</h2><button class="btn small alt" onclick="nav('settings')">⚙ Einstellungen</button></div><div class="card pad"><div class="titlebar"><strong>Island-Rundreise</strong><span class="sub">${completed}/${state.stops.length} Stopps erledigt</span></div><div class="progress"><span style="width:${state.stops.length?completed/state.stops.length*100:0}%"></span></div><div class="map"><iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-25.2%2C63.1%2C-12.8%2C67.0&layer=mapnik"></iframe></div><p class="sub">Die Karte zeigt zunächst Island. Eine echte Routenlinie ergänzen wir nach der gemeinsamen Etappenplanung.</p></div><h2 class="section">Reiseverlauf</h2><div class="cards">${state.days.map((d,i)=>`<div class="card" onclick="openDay('${d.id}')"><img class="photo" src="${esc(d.image||photo.hero)}"><div class="pad"><span class="pill">Tag ${i+1} · ${fmt(d.date)}</span><h3 style="margin:7px 0">${esc(d.title)}</h3><div class="sub">${esc(d.route)}</div><div class="sub" style="margin-top:7px">${state.stops.filter(s=>s.day===d.id&&s.done).length}/${state.stops.filter(s=>s.day===d.id).length} Stopps</div></div></div>`).join('')}</div></div>`}
function day(){let d=state.days.find(x=>x.id===selected)||state.days[0],i=state.days.indexOf(d),stops=state.stops.filter(s=>s.day===d.id).sort((a,b)=>a.time.localeCompare(b.time)),stay=state.stays.find(s=>s.checkin===d.date),ongoing=state.stays.find(s=>s.checkin<d.date&&s.checkout>d.date);return `<div class="hero" style="background-image:linear-gradient(180deg,transparent 15%,rgba(14,35,39,.85)),url('${esc(d.image||photo.hero)}')"><div><div class="eyebrow">Tag ${i+1} · ${fmt(d.date)}</div><h1 style="font-size:40px">${esc(d.title)}</h1><p>${esc(d.route)}</p></div></div><div class="content"><div class="row between"><button class="btn alt small" onclick="nav('home')">← Alle Tage</button><button class="btn small alt" onclick="nav('settings')">↻ Google Sheets</button></div><p>${esc(d.description)}</p>${ongoing?`<div class="info">🛏 Heute: <b>${esc(ongoing.name)}</b> · weitere Nacht am selben Ort</div>`:''}<h2 class="section">Tagesablauf</h2><div class="card">${stops.length?stops.map(stopHTML).join(''):'<div class="pad sub">Noch keine Stopps erfasst.</div>'}</div><button class="btn" onclick="edit('stop','new')">＋ Stopp hinzufügen</button>${stay?`<h2 class="section">Check-in & Unterkunft</h2>${stayHTML(stay)}`:''}<div style="height:25px"></div><div class="row between"><button class="btn alt" ${i===0?'disabled':''} onclick="openDay(state.days[${'Math.max(0,i-1)'}].id)">← Vorheriger Tag</button><button class="btn alt" ${i===state.days.length-1?'disabled':''} onclick="openDay(state.days[${'Math.min(state.days.length-1,i+1)'}].id)">Nächster Tag →</button></div></div>`}
function detailView(){let s=state.stops.find(x=>x.id===detail);if(!s)return nav('home');return `<div class="detail"><img class="photo" src="${esc(s.image||photo.water)}"><div class="content"><button class="btn alt small" onclick="openDay('${s.day}')">← Tagesablauf</button><div class="sub" style="margin-top:18px">${esc(s.type)} · ${esc(s.time)} ${s.duration?'· '+esc(s.duration):''}</div><h2>${esc(s.title)}</h2><div class="info"><b>🎧 Audio-Reiseführer</b><p class="sub">Vorlesetext wird aus der Beschreibung oder einem eigenen Audiotext verwendet.</p><button class="btn" onclick="speak('${s.id}')">▶ Vorlesen</button> <button class="btn alt" onclick="speechSynthesis.cancel()">■ Stopp</button><p class="tiny muted">Testversion: Gerätestimme. Hochwertige KI-Audiodateien und Offline-Audio folgen.</p></div><h3>Entdecken</h3><p>${esc(s.description)}</p>${s.notes?`<div class="info"><b>Praktische Hinweise</b><p>${esc(s.notes)}</p></div>`:''}<div class="row between"><label class="row"><input class="check" type="checkbox" ${s.done?'checked':''} onchange="toggle('stops','${s.id}',this.checked)"> Besucht</label><button class="btn" onclick="edit('stop','${s.id}')">✎ Bearbeiten</button></div></div></div>`}
function speak(id){let s=state.stops.find(x=>x.id===id);if(!('speechSynthesis'in window)){alert('Vorlesen wird von diesem Browser nicht unterstützt.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s.audio||s.description);u.lang='de-DE';u.rate=.92;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.startsWith('de')&&/natural|premium|google/i.test(v.name))||voices.find(v=>v.lang.startsWith('de'))||null;speechSynthesis.speak(u)}async function toggle(collection,id,v){let o=state[collection].find(x=>x.id===id);if(!o)return;if(collection==='stops'){const candidate={...o,done:v};try{await writeStopToSheets(candidate,false);Object.assign(o,candidate)}catch(e){alert('Besucht-Status nicht gespeichert: '+e.message);render();return}}else o.done=v;save();render()}
function stayHTML(s){let remaining=Math.max(0,(Number(s.total)||0)-(Number(s.paid)||0));return `<div class="card"><div class="pad"><div class="row between"><div><b style="font-size:19px">${esc(s.name)}</b><div class="sub">${esc(s.checkin)} – ${esc(s.checkout)} · ${esc(s.address||'')}</div></div><button class="btn small alt" onclick="edit('stay','${s.id}')">✎</button></div><p>${['Küche','Pool','Frühstück','WLAN','Parkplatz','Waschmaschine'].filter(x=>(s.features||'').toLowerCase().includes(x.toLowerCase())).map(x=>`<span class="pill">${x}</span>`).join('')}</p><div class="grid2"><div><span class="sub">Gesamtpreis</span><br><b>${currency(s.total,s.currency)}</b></div><div><span class="sub">Restbetrag</span><br><b>${currency(remaining,s.currency)}</b></div></div><p class="sub">Bezahlt: ${currency(s.paid,s.currency)} · Check-in: ${esc(s.checkinTime||'offen')} · Check-out: ${esc(s.checkoutTime||'offen')}</p>${s.extras?`<div class="info"><b>Weitere Informationen</b><p>${esc(s.extras)}</p></div>`:''}${s.notes?`<p>${esc(s.notes)}</p>`:''}</div></div>`}
function stays(){return `<div class="content"><div class="titlebar"><h2 class="section">Unterkünfte</h2><button class="btn small" onclick="edit('stay','new')">＋ Unterkunft</button></div><p class="sub">Eine Buchung pro Aufenthalt. Der Check-in erscheint nur am ersten Tag im Tagesablauf.</p>${state.stays.length?state.stays.map(stayHTML).join(''):'<div class="info">Noch keine Unterkünfte erfasst. Hier könnt ihr Küche, Pool, bezahlt, Restbetrag und frei definierbare Informationen speichern.</div>'}</div>`}
function flights(){return `<div class="content"><h2 class="section">Flüge & Anreise</h2><p>Die Reise beginnt mit dem Hinflug und endet mit dem Rückflug. Flugzeiten und Buchungen werden ausschliesslich in Google Sheets gepflegt.</p>${state.flights.map(f=>`<div class="card pad"><div class="row between"><span class="pill">✈ ${esc(f.direction)}</span></div><h3>${esc(f.from)} → ${esc(f.to)}</h3><p class="sub">${f.date && /^\d{4}-\d{2}-\d{2}$/.test(f.date)?fmt(f.date):'Datum offen'} · ${esc(f.airline||'Airline offen')} ${esc(f.number||'')}</p><div class="grid2"><div><span class="sub">Abflug</span><br><b>${esc(f.departure||'offen')}</b></div><div><span class="sub">Ankunft</span><br><b>${esc(f.arrival||'offen')}</b></div><div><span class="sub">Gesamt</span><br><b>${currency(f.total,f.currency)}</b></div><div><span class="sub">Restbetrag</span><br><b>${currency(Math.max(0,f.total-f.paid),f.currency)}</b></div></div><p>${esc(f.notes||'')}</p></div>`).join('')}</div>`}
function tasks(){return `<div class="content"><h2 class="section">Gemeinsame Checkliste</h2><div class="card">${state.tasks.map(t=>`<div class="stop"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggle('tasks','${t.id}',this.checked)"><div class="grow">${esc(t.title)}</div><button class="btn small alt" onclick="edit('task','${t.id}')">✎</button></div>`).join('')}</div><button class="btn" onclick="edit('task','new')">＋ Aufgabe</button></div>`}
const infoLevels=[['3 Sätze',3],['5 Sätze',5],['150 Wörter',150],['300 Wörter',300],['600 Wörter',600]];
function promptText(id){const s=state.stops.find(x=>x.id===id);const level=Number(document.getElementById('infoLevel')?.value||2);const [label,n]=infoLevels[level];const focus=document.getElementById('infoFocus')?.value||'lebendig, informativ und anschaulich';return `Schreibe für unser privates Island-Reiseroadbook einen ${focus}en deutschen Text über ${s.title}. Umfang: ${label}. Erkläre die wichtigsten Besonderheiten, geschichtlichen oder geologischen Hintergründe und praktische Tipps für einen Besuch. Keine erfundenen Fakten oder konkreten Öffnungszeiten ohne Beleg. Gib nur den fertigen Roadbook-Text zurück.`}
function updatePromptLabel(){let x=document.getElementById('infoLevel');if(x)document.getElementById('infoLabel').textContent=infoLevels[Number(x.value)][0]}
function copyPrompt(id){const prompt=promptText(id);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(prompt).then(()=>alert('Gemini-Auftrag kopiert. In Gemini einfügen, Antwort danach hier in die Beschreibung übernehmen.')).catch(()=>fallbackCopy(prompt));else fallbackCopy(prompt)}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('Gemini-Auftrag kopiert. In Gemini einfügen.')}
function shiftTrip(){const first=state.days[0].date;const target=document.getElementById('newStart').value;if(!target)return;const offset=Math.round((Date.parse(target+'T12:00:00Z')-Date.parse(first+'T12:00:00Z'))/86400000);if(!offset){alert('Startdatum unverändert.');return}const move=d=>{if(!d)return d;const x=new Date(d+'T12:00:00Z');if(isNaN(x))return d;x.setUTCDate(x.getUTCDate()+offset);return x.toISOString().slice(0,10)};const booked=state.stays.length+state.flights.filter(f=>f.booking).length;if(!confirm(`Alle ${state.days.length} Reisetage um ${offset} Tage verschieben?\n\n${booked} Unterkunfts- oder Flugbuchungen vorhanden. Buchungsdaten werden NICHT automatisch geändert und müssen geprüft werden.`))return;state.days.forEach(d=>d.date=move(d.date));save();render();alert('Reisetage verschoben. Flüge und Unterkünfte wurden bewusst nicht verändert.')}
function addTripDay(){const last=state.days[state.days.length-1],n=state.days.length,dt=new Date(last.date+'T12:00:00Z');dt.setUTCDate(dt.getUTCDate()+1);state.days.push({id:'day'+n,date:dt.toISOString().slice(0,10),title:'Island entdecken · Tag '+(n+1),route:'Route noch planen',description:'',image:photo.hero});save();render()}
const schema={day:[['title','Titel'],['route','Route'],['description','Tagesbeschreibung','textarea'],['image','Bild-URL']],stop:[['day','Reisetag','day'],['time','Uhrzeit'],['title','Titel'],['type','Kategorie'],['duration','Dauer'],['image','Foto-URL'],['description','Ausführliche Beschreibung','textarea'],['audio','Vorlesetext (optional)','textarea'],['notes','Praktische Hinweise / Fototipps','textarea']],stay:[['name','Name der Unterkunft'],['checkin','Check-in Datum','date'],['checkout','Check-out Datum','date'],['address','Adresse'],['checkinTime','Check-in Uhrzeit'],['checkoutTime','Check-out Uhrzeit'],['features','Ausstattung (Küche, Pool, WLAN usw.)'],['total','Gesamtpreis','number'],['paid','Bereits bezahlt','number'],['currency','Währung'],['extras','Freie Zusatzfelder (z.B. Whirlpool: ja)','textarea'],['notes','Buchungsdetails / Schlüssel / Hinweise','textarea']],flight:[['date','Datum','date'],['from','Von'],['to','Nach'],['airline','Fluggesellschaft'],['number','Flugnummer'],['departure','Abflugzeit'],['arrival','Ankunftszeit'],['booking','Buchungsreferenz'],['total','Gesamtpreis','number'],['paid','Bezahlt','number'],['currency','Währung'],['notes','Notizen','textarea']],task:[['title','Aufgabe']]};function editView(){if(!editing)return '';let {kind,id}=editing,col={day:'days',stop:'stops',stay:'stays',flight:'flights',task:'tasks'}[kind],obj=id==='new'?{}:state[col].find(x=>x.id===id)||{},fields=schema[kind];return `<div class="content"><button class="btn alt small" onclick="nav('${kind==='stop'?'day':kind==='stay'?'stays':kind==='flight'?'flights':kind==='task'?'tasks':'day'}')">← Zurück</button><h2 class="section">${id==='new'?'Neuen Eintrag erstellen':'Eintrag bearbeiten'}</h2><form class="form" onsubmit="submitEdit(event)">${fields.map(([key,label,type])=>`<label>${label}${type==='textarea'?`<textarea name="${key}">${esc(obj[key]||'')}</textarea>`:type==='day'?`<select name="${key}">${state.days.map((d,i)=>`<option value="${d.id}" ${(obj[key]||selected)===d.id?'selected':''}>Tag ${i+1} · ${fmt(d.date)}</option>`).join('')}</select>`:`<input name="${key}" type="${type||'text'}" value="${esc(obj[key]??(key==='currency'?'CHF':key==='checkin'?state.days[0].date:key==='checkout'?state.days[1].date:''))}">`}</label>`).join('')}<button class="btn" type="submit">✓ Speichern</button></form>${kind==='stop'&&id!=='new'?`<div class="card pad"><h3>✨ Gemini-Textassistent</h3><p class="sub">Noch keine direkte KI-Anbindung. Du kannst aber schon den passenden Gemini-Auftrag mit einem Klick kopieren.</p><label>Textumfang: <b id="infoLabel">150 Wörter</b><input id="infoLevel" type="range" min="0" max="4" value="2" oninput="updatePromptLabel()"></label><label>Stil<select id="infoFocus"><option value="lebendig, informativ und anschaulich">Lebendig und informativ</option><option value="sachlich und kompakt">Sachlich</option><option value="praktisch und fotobegeistert">Praktisch mit Fototipps</option></select></label><button class="btn" type="button" onclick="copyPrompt('${id}')">Gemini-Auftrag kopieren</button><p class="sub">Den generierten Text danach oben in «Ausführliche Beschreibung» einfügen und speichern.</p></div>`:''}${id!=='new'&&kind!=='day'&&kind!=='flight'?`<p><button class="btn alt" onclick="removeEntry()">Eintrag löschen</button></p>`:''}</div>`}async function submitEdit(e){e.preventDefault();let {kind,id}=editing,col={day:'days',stop:'stops',stay:'stays',flight:'flights',task:'tasks'}[kind],isNew=id==='new';let original=isNew?null:state[col].find(x=>x.id===id);let o=isNew?{id:kind+'-'+Date.now()}:structuredClone(original);new FormData(e.target).forEach((v,k)=>o[k]=['total','paid'].includes(k)?Number(v):v);if(isNew&&(kind==='stop'||kind==='task'))o.done=false;
if(kind==='stop'){try{await writeStopToSheets(o,isNew)}catch(err){alert('Der Stopp wurde NICHT gespeichert: '+err.message);return}}
if(isNew)state[col].push(o);else Object.assign(original,o);save();let dest={day:'day',stop:'day',stay:'stays',flight:'flights',task:'tasks'}[kind];if(kind==='stop')selected=o.day;nav(dest)}
async function removeEntry(){if(!confirm('Eintrag wirklich löschen?'))return;let {kind,id}=editing,col={stop:'stops',stay:'stays',task:'tasks'}[kind];if(kind==='stop'){try{await deleteStopFromSheets(id)}catch(err){alert('Löschen fehlgeschlagen: '+err.message);return}}state[col]=state[col].filter(x=>x.id!==id);save();nav(kind==='stop'?'day':kind==='stay'?'stays':'tasks')}
function settings(){return `<div class="content"><h2 class="section">Google Sheets · Reiseplanung</h2><div class="card pad"><h3>Verbindung mit deiner privaten Tabelle</h3><p>Die Google-Tabelle bestimmt Reisedaten, Anzahl Tage und Tagesroute. Änderungen an der Route erfolgen ausschliesslich dort.</p><p>${sheetId?`<a href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/edit" target="_blank" rel="noopener noreferrer">↗ Reiseplanung in Google Sheets öffnen</a>`:'Zuerst Tabellen-ID eintragen.'}</p><label>Google Sheets Tabellen-ID <input id="sheetIdInput" type="text" placeholder="ID aus deiner privaten Google-Sheets-Adresse" value="${esc(sheetId)}"></label><p class="sub">Status: <strong>${sheetsConnected?'✓ Daten aus Google Sheets geladen':'Nicht verbunden – nur lokale Beispielplanung sichtbar'}</strong></p><label>Google OAuth Client-ID <input id="oauthClientId" type="text" placeholder="…apps.googleusercontent.com" value="${esc(googleClientId)}"></label><p class="sub">Die OAuth-Client-ID ist öffentlich und kein Passwort. Die private Tabellen-ID wird nur in diesem Browser gespeichert und nicht im GitHub-Code veröffentlicht. Anmeldung nur über eine bei Google registrierte HTTPS-Domain.</p><button class="btn" onclick="connectSheets()">Mit Google anmelden und Tabelle laden</button> <button class="btn alt" onclick="refreshSheets()">↻ Aktualisieren</button><p id="syncStatus" class="sub"></p></div><div class="notice"><b>Wichtig:</b> V5 liest Reiseübersicht, Flüge und Tagesablauf. Roadbook-Stopps werden direkt in Google Sheets gespeichert, sofern die Google-Anmeldung aktiv ist. Eine einfache Änderungsprüfung hilft gegen Überschreiben, ist aber noch keine vollständige Mehrbenutzer-Konfliktlösung. Unterkünfte und Aufgaben bleiben vorerst nur in diesem Browser. Bitte regelmäßig eine JSON-Sicherung erstellen. Für die Anmeldung muss die App über eine registrierte HTTPS-Webadresse laufen – nicht als lokale file://-Datei.</div><div class="card pad"><h3>Datensicherung</h3><button class="btn alt" onclick="exportJSON()">↓ JSON exportieren</button><p><label class="btn alt" style="display:inline-block">↑ JSON importieren<input type="file" accept="application/json" style="display:none" onchange="importJSON(event)"></label></p></div></div>`}
function syncStatus(message){const e=document.getElementById('syncStatus');if(e)e.textContent=message}
function connectSheets(){sheetId=(document.getElementById('sheetIdInput')?.value||sheetId).trim();if(!/^[A-Za-z0-9_-]{20,}$/.test(sheetId)){alert('Bitte eine gültige Google-Sheets-Tabellen-ID eingeben.');return}localStorage.setItem(SHEET_STORAGE_KEY,sheetId);const input=document.getElementById('oauthClientId');googleClientId=(input?.value||googleClientId).trim();if(!googleClientId.endsWith('.apps.googleusercontent.com')){alert('Bitte zuerst eine gültige Google OAuth Client-ID eintragen.');return}localStorage.setItem('island-google-oauth-client-id',googleClientId);if(location.protocol==='file:'){alert('Google-Anmeldung funktioniert nicht aus einer lokalen HTML-Datei. Die App muss zuerst über HTTPS veröffentlicht werden.');return}if(!window.google?.accounts?.oauth2){alert('Google-Anmeldung konnte nicht geladen werden. Internetverbindung und Browser prüfen.');return}try{google.accounts.oauth2.initTokenClient({client_id:googleClientId,scope:'https://www.googleapis.com/auth/spreadsheets',callback:async r=>{if(r.error){syncStatus('Anmeldung fehlgeschlagen: '+r.error);return}googleToken=r.access_token;await refreshSheets()}}).requestAccessToken({prompt:'consent'})}catch(e){syncStatus('Fehler: '+e.message)}}

/* Tagesablauf in Google Sheets; Reiseübersicht bleibt unverändert */
function stopSignature(r){return JSON.stringify(Array.from({length:15},(_,i)=>String(r[i]??'')))}
function stopFromSheet(r){return {id:String(r[0]),day:String(r[1]),order:Number(r[2])||0,time:String(r[3]||''),title:String(r[4]||''),type:String(r[5]||''),duration:String(r[6]||''),description:String(r[7]||''),audio:String(r[8]||''),image:String(r[9]||''),audioUrl:String(r[10]||''),navigationUrl:String(r[11]||''),done:String(r[12]||'').toLowerCase()==='true',notes:String(r[13]||''),changedAt:String(r[14]||'')}}
function stopToRow(s){return [s.id||'',s.day||'',s.order||'',s.time||'',s.title||'',s.type||'',s.duration||'',s.description||'',s.audio||'',s.image||'',s.audioUrl||'',s.navigationUrl||'',s.done?'TRUE':'FALSE',s.notes||'',new Date().toISOString()]}
function sheetsEndpoint(path){return 'https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(sheetId)+path}
async function sheetsRequest(url,options={}){if(!googleToken||!sheetId||!stopsSynced)throw Error('Bitte unter Einstellungen zuerst mit Google anmelden und die Tabelle laden.');let r=await fetch(url,{...options,headers:{Authorization:'Bearer '+googleToken,...(options.body?{'Content-Type':'application/json'}:{})}});if(!r.ok){let err=await r.text();if(r.status===401)throw Error('Google-Anmeldung abgelaufen. Bitte neu anmelden.');if(r.status===403)throw Error('Schreibzugriff verweigert. Bitte erneut anmelden und Schreibzugriff erlauben.');throw Error('Google Sheets HTTP '+r.status+': '+err.slice(0,200))}return r.json()}
async function fetchStopRows(){const j=await sheetsRequest(sheetsEndpoint("/values/"+encodeURIComponent("'Tagesablauf'!A1:O1000")));return j.values||[]}
async function writeStopToSheets(s,isNew){const rows=await fetchStopRows();let idx=rows.findIndex((r,i)=>i>0&&String(r[0])===String(s.id));const old=stopSnapshots.get(s.id);
if(isNew&&idx>=0)throw Error('Diese Stopp-ID existiert bereits. Bitte erneut versuchen.');
if(!isNew&&idx<0)throw Error('Der Stopp wurde in Google Sheets gelöscht. Bitte zuerst aktualisieren.');
if(!isNew&&old!==stopSignature(rows[idx]))throw Error('Dieser Stopp wurde zwischenzeitlich verändert. Bitte aktualisieren.');
const values=[stopToRow(s)],range=idx>=0?"'Tagesablauf'!A"+(idx+1)+":O"+(idx+1):"'Tagesablauf'!A:O";
if(idx>=0){await sheetsRequest(sheetsEndpoint('/values/'+encodeURIComponent(range)+'?valueInputOption=RAW'),{method:'PUT',body:JSON.stringify({range,majorDimension:'ROWS',values})})}
else{await sheetsRequest(sheetsEndpoint('/values/'+encodeURIComponent(range)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS'),{method:'POST',body:JSON.stringify({range,majorDimension:'ROWS',values})})}
stopSnapshots.set(s.id,stopSignature(values[0]));s.changedAt=values[0][14]}
async function deleteStopFromSheets(id){const rows=await fetchStopRows(),idx=rows.findIndex((r,i)=>i>0&&String(r[0])===String(id));if(idx<0)throw Error('Stopp existiert nicht mehr in der Tabelle.');if(stopSnapshots.get(id)!==stopSignature(rows[idx]))throw Error('Stopp wurde anderswo verändert. Bitte zuerst aktualisieren.');const range="'Tagesablauf'!A"+(idx+1)+":O"+(idx+1);await sheetsRequest(sheetsEndpoint('/values/'+encodeURIComponent(range)+':clear'),{method:'POST',body:'{}'});stopSnapshots.delete(id)}
async function refreshSheets(){if(!sheetId){syncStatus('Bitte zuerst die Tabellen-ID in den Einstellungen speichern.');return}if(!googleToken){syncStatus('Bitte zuerst mit Google anmelden.');return}syncStatus('Lese Google-Tabelle …');try{const ranges=["'Reiseübersicht'!A1:L200","'Flüge'!A1:Q100","'Tagesablauf'!A1:O1000"];const url='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(sheetId)+'/values:batchGet?'+ranges.map(r=>'ranges='+encodeURIComponent(r)).join('&');const response=await fetch(url,{headers:{Authorization:'Bearer '+googleToken}});if(!response.ok){let detail=await response.text();throw Error('Google Sheets HTTP '+response.status+': '+detail.slice(0,260))}const data=await response.json();const rows=data.valueRanges?.[0]?.values||[];if(rows.length<2)throw Error('Die Reiseübersicht enthält noch keine Reisetage.');const oldById=new Map(state.days.map(d=>[d.id,d]));const parsed=rows.slice(1).filter(r=>r[0]&&r[1]).map((r,i)=>{const id=String(r[0]).trim();const prev=oldById.get(id)||{};let date=String(r[1]);if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(date)){const [dd,mm,yy]=date.split('.');date=yy+'-'+mm.padStart(2,'0')+'-'+dd.padStart(2,'0')}if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Ungültiges Datum in Zeile '+(i+2)+': '+date);return {...prev,id,date,title:r[8]||r[4]||'Tag '+(i+1),route:[r[3],r[4]].filter(Boolean).join(' → ')||'Noch nicht geplant',description:r[11]||prev.description||'',image:prev.image||photo.hero}});if(!parsed.length)throw Error('Keine gültigen Tage gefunden');const flightsRows=data.valueRanges?.[1]?.values||[];const oldFlights=new Map(state.flights.map(f=>[f.id,f]));const flights=flightsRows.slice(1).filter(r=>r[0]).map(r=>({...(oldFlights.get(r[0])||{}),id:r[0],direction:r[1]||'',date:r[2]||'',from:r[3]||'',to:r[4]||'',airline:r[5]||'',number:r[6]||'',departure:r[7]||'',arrival:r[8]||'',booking:r[10]||'',total:Number(r[11])||0,paid:Number(r[12])||0,currency:'CHF',notes:r[16]||''}));state.stops.forEach(st=>{if(/^day\d+$/.test(st.day)){const ix=Number(st.day.slice(3));if(parsed[ix])st.day=parsed[ix].id}});state.days=parsed;if(flights.length)state.flights=flights;
const stopRows=data.valueRanges?.[2]?.values||[];
const hasLocal=state.stops.some(x=>!['flight-in','car','flight-out'].includes(x.id));
if(!stopsSynced&&hasLocal){if(!confirm('Bisherige lokale Stopps gefunden. Bitte vorher unter Einstellungen JSON exportieren. Beim Fortfahren werden die Stopps aus Google Sheets geladen. Fortfahren?')){syncStatus('Bitte lokale Stopps zuerst als JSON sichern.');return}}
stopSnapshots=new Map();state.stops=stopRows.slice(1).filter(r=>r[0]&&r[1]).map(r=>{const stop=stopFromSheet(r);stopSnapshots.set(stop.id,stopSignature(r));return stop});stopsSynced=true;
const dayIds=new Set(parsed.map(d=>d.id));const orphan=state.stops.filter(s=>!dayIds.has(s.day)).length;sheetsConnected=true;save();render();nav('home');alert('✓ '+parsed.length+' Reisetage aus Google Sheets geladen.'+(orphan?' Achtung: '+orphan+' lokale Stopps sind nicht mehr einem gültigen Tag zugeordnet.':''))}catch(e){syncStatus('Fehler beim Laden: '+e.message)}}
function exportJSON(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Island-2027-Roadbook.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importJSON(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.days)||!Array.isArray(x.stops)||!Array.isArray(x.flights))throw Error('Falsches Format');if(!confirm('Aktuelle Daten durch die importierten ersetzen?'))return;state=x;save();nav('home')}catch(err){alert('Import fehlgeschlagen: '+err.message)}}function render(){el.innerHTML=({home,day,detail:detailView,stays,flights,tasks,settings,edit:editView}[view]||home)();let items=[['home','⌂','Reise'],['flights','✈','Flüge'],['day','▤','Tage'],['stays','⌂','Hotels'],['tasks','☑','Aufgaben']];document.getElementById('bottom').innerHTML=items.map(([v,ic,l])=>`<button class="${view===v?'active':''}" onclick="nav('${v}')"><b>${ic}</b>${l}</button>`).join('')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
